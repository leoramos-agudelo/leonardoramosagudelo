<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img"><style>@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Inter,system-ui,sans-serif;}</style><rect width="1600" height="800" fill="#e8f0fe"/><text x="800.0" y="110" text-anchor="middle" font-size="46" font-weight="700" fill="#0a1f3c" letter-spacing="2">MIS RECOMENDACIONES</text><text x="800.0" y="151" text-anchor="middle" font-size="25" font-weight="400" fill="#5b6678">Cuatro ideas para que el efectivo deje de frenar la carretera</text><rect x="70" y="308" width="347" height="418" rx="18" fill="#ffffff" stroke="#dbe4f2" stroke-width="2"/><path d="M 165.5 308 A 78 78 0 0 1 321.5 308 Z" fill="#2f7cf6"/><text x="243.5" y="276" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff">1</text><text x="243.5" y="428" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">El tag, la regla</text><text x="243.5" y="496" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">Incentivo antes que</text><text x="243.5" y="534" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">obligación: que pagar en</text><text x="243.5" y="572" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">efectivo cueste más y</text><text x="243.5" y="610" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">tome más tiempo.</text><rect x="441" y="308" width="347" height="418" rx="18" fill="#ffffff" stroke="#dbe4f2" stroke-width="2"/><path d="M 536.5 308 A 78 78 0 0 1 692.5 308 Z" fill="#e8823a"/><text x="614.5" y="276" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff">2</text><text x="614.5" y="428" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">El efectivo paga</text><text x="614.5" y="474" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">su costo</text><text x="614.5" y="542" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">El recargo no es un</text><text x="614.5" y="580" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">castigo: es el precio de la</text><text x="614.5" y="618" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">fricción que genera.</text><rect x="812" y="308" width="347" height="418" rx="18" fill="#ffffff" stroke="#dbe4f2" stroke-width="2"/><path d="M 907.5 308 A 78 78 0 0 1 1063.5 308 Z" fill="#17a398"/><text x="985.5" y="276" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff">3</text><text x="985.5" y="428" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">Seguridad antes</text><text x="985.5" y="474" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">que costumbre</text><text x="985.5" y="542" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">Uruguay lo midió: 25%</text><text x="985.5" y="580" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">menos robos en</text><text x="985.5" y="618" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">gasolineras.</text><rect x="1183" y="308" width="347" height="418" rx="18" fill="#ffffff" stroke="#dbe4f2" stroke-width="2"/><path d="M 1278.5 308 A 78 78 0 0 1 1434.5 308 Z" fill="#63a4ff"/><text x="1356.5" y="276" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff">4</text><text x="1356.5" y="428" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">Una sola forma de</text><text x="1356.5" y="474" text-anchor="middle" font-size="32" font-weight="700" fill="#0a1f3c">pagar</text><text x="1356.5" y="542" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">El mismo tag para peaje</text><text x="1356.5" y="580" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">y estacionamiento. Así se</text><text x="1356.5" y="618" text-anchor="middle" font-size="24" font-weight="400" fill="#5b6678">volvió regla en Chile.</text></svg>