<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ecosistema de los viajes corporativos</title><desc id="d">Diagrama: al centro, empresa y viajero (viajero, manager, finanzas y RH, política de viajes). Flujo de reserva: herramienta de reservas, TMC (agencia), GDS (Amadeus, Sabre, Travelport) y proveedores (aerolíneas, hoteles). Flujo de dinero: pagos con tarjeta corporativa, AirPlus, UATP e IATA hacia los proveedores; después del viaje, gastos, recibos y reembolsos regresan a la empresa.</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2d5a"/></marker>
