<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">El gasto en viajes de negocio crece más rápido que los viajes, y la fricción sigue siendo manual</title><desc id="d">Gasto global en viajes de negocio según GBTA y principales puntos de dolor (GBTA 2025, Blacklane 2025).</desc><rect width="1200" height="750" fill="#fff"/><text x="50" y="62" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">El gasto en viajes de negocio crece más rápido que los viajes,</text><text x="50" y="100" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">y la fricción sigue siendo manual</text><rect x="50" y="124" width="1100" height="1.5" fill="#1f2d5a"/><text x="50" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">TAMAÑO DEL MERCADO</text><text x="50" y="232" font-size="50" font-weight="700" fill="#1f2d5a" text-anchor="start">US$1.59 billones</text><text x="50" y="262" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">gasto global en viajes de negocio, 2025</text><text x="50" y="322" font-size="36" font-weight="700" fill="#138a8a" text-anchor="start">+8.4%</text><text x="50" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">crecimiento del gasto en 2025</text><text x="335" y="322" font-size="36" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71 billones</text><text x="335" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">pronóstico 2026</text><text x="50" y="400" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Gasto (US$ billones)</text><text x="50" y="436" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="416" width="307" height="26" fill="#9aa3b8"/><text x="426.8421052631579" y="436" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.59</text><text x="50" y="472" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026P</text><rect x="110" y="452" width="330" height="26" fill="#138a8a"/><text x="450.0" y="472" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71</text><text x="50" y="510" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Viajes (miles de millones)</text><text x="50" y="546" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="526" width="326" height="26" fill="#9aa3b8"/><text x="446.4130434782609" y="546" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.82</text><text x="50" y="582" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026P</text><rect x="110" y="562" width="330" height="26" fill="#138a8a"/><text x="450.0" y="582" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.84</text><text x="50" y="632" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">El gasto crece más rápido que el número de viajes,</text><text x="50" y="654" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">sobre todo porque transporte y hospedaje cuestan</text><text x="50" y="676" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">más.</text><rect x="590" y="150" width="1" height="530" fill="#d9dde6"/><text x="625" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">PUNTOS DE DOLOR</text><text x="625" y="218" font-size="44" font-weight="700" fill="#138a8a" text-anchor="start">63%</text><text x="625" y="248" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">de los travel managers</text><text x="625" y="269" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">señaló el envío manual y</text><text x="625" y="290" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">lento de gastos como el</text><text x="625" y="311" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">principal punto de dolor</text><text x="895" y="218" font-size="44" font-weight="700" fill="#138a8a" text-anchor="start">55%</text><text x="895" y="248" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">señaló la captura automática</text><text x="895" y="269" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">de comprobantes y su</text><text x="895" y="290" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">conciliación como mejora</text><text x="895" y="311" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">clave</text><text x="625" y="376" font-size="22" font-weight="700" fill="#1f2d5a" text-anchor="start">Solo el</text><text x="705" y="376" font-size="44" font-weight="700" fill="#1f2d5a" text-anchor="start">54%</text><text x="625" y="406" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">de los viajeros de negocio</text><text x="625" y="427" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">consulta su política de</text><text x="625" y="448" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">viajes a menudo o siempre</text><text x="895" y="376" font-size="44" font-weight="700" fill="#1f2d5a" text-anchor="start">47%</text><text x="895" y="406" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">cree que salirse de la</text><text x="895" y="427" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">política le ahorra dinero a</text><text x="895" y="448" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">la empresa</text><rect x="625" y="472" width="525" height="1" fill="#d9dde6"/><text x="625" y="500" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Viajero</text><circle cx="790" cy="494" r="3" fill="#138a8a"/><text x="802" y="500" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Herramientas de reserva difíciles de</text><text x="802" y="521" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">usar empujan fuera de la política</text><text x="625" y="552" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Finanzas</text><circle cx="790" cy="546" r="3" fill="#138a8a"/><text x="802" y="552" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Procesos manuales y comprobantes por</text><text x="802" y="573" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">perseguir</text><circle cx="790" cy="592" r="3" fill="#138a8a"/><text x="802" y="598" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Poca visibilidad entre sistemas</text><text x="625" y="629" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Travel managers</text><circle cx="790" cy="623" r="3" fill="#138a8a"/><text x="802" y="629" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Horas en contingencias y cumplimiento</text><circle cx="790" cy="648" r="3" fill="#138a8a"/><text x="802" y="654" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Más controles, más fricción</text><rect x="50" y="700" width="1100" height="1" fill="#d9dde6"/><text x="50" y="728" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Fuente: GBTA (2025, 2026); Blacklane (2025)</text><text x="1150" y="728" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="end">Exhibit 1</text></svg>