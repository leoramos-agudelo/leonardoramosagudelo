<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">El gasto en viajes de negocio crece más rápido que los viajes, y la fricción sigue siendo manual</title><desc id="d">Gasto global en viajes de negocio según GBTA y principales puntos de dolor (GBTA 2025, Blacklane 2025).</desc><rect width="1200" height="750" fill="#fff"/><text x="50" y="62" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">El gasto en viajes de negocio crece más rápido que los viajes,</text><text x="50" y="100" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">y la fricción sigue siendo manual</text><rect x="50" y="124" width="1100" height="1.5" fill="#1f2d5a"/><text x="50" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">TAMAÑO DEL MERCADO</text><text x="50" y="232" font-size="50" font-weight="700" fill="#1f2d5a" text-anchor="start">US$1.59 billones</text><text x="50" y="262" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">gasto global en viajes de negocio, 2025</text><text x="50" y="322" font-size="36" font-weight="700" fill="#138a8a" text-anchor="start">+8.4%</text><text x="50" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">crecimiento del gasto en 2025</text><text x="335" y="322" font-size="36" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71 billones</text><text x="335" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">pronóstico 2026</text><text x="50" y="400" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Gasto (US$ billones)</text><text x="50" y="436" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="416" width="307" height="26" fill="#9aa3b8"/><text x="426.8421052631579" y="436" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.59</text><text x="50" y="472" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026P</text><rect x="110" y="452" width="330" height="26" fill="#138a8a"/><text x="450.0" y="472" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71</text><text x="50" y="510" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Viajes (miles de millones)</text><text x="50" y="546" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="526" width="326" height="26" fill="#9aa3b8"/><text x="446.4130434782609" y="546" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.82</text><text x="50" y="582" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026P</text><rect x="110" y="562" width="330" height="26" fill="#138a8a"/><text x="450.0" y="582" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.84</text><text x="50" y="632" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">El gasto crece más rápido que el número de viajes,</text><text x="50" y="654" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">sobre todo porque transporte y hospedaje cuestan</text><text x="50" y="676" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">más.</text><rect x="590" y="150" width="1" height="530" fill="#d9dde6"/><text x="625" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">TRES MENSAJES</text><text x="625" y="212" font-size="20" font-weight="700" fill="#1f2d5a" text-anchor="start">1. Se gasta más por viaje</text><text x="625" y="262" font-size="40" font-weight="700" fill="#138a8a" text-anchor="start">$1.59 → $1.71 billones</text><text x="625" y="292" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">gasto global 2025 → pronóstico 2026; el gasto</text><text x="625" y="313" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">crece más rápido que los viajes</text><rect x="625" y="342" width="525" height="1" fill="#d9dde6"/><text x="625" y="378" font-size="20" font-weight="700" fill="#1f2d5a" text-anchor="start">2. Los gastos siguen siendo un dolor</text><text x="625" y="428" font-size="40" font-weight="700" fill="#138a8a" text-anchor="start">La mitad</text><text x="625" y="458" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">de los travel managers dice que los reportes</text><text x="625" y="479" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">de gastos generan fricción (GBTA, 2025)</text><rect x="625" y="508" width="525" height="1" fill="#d9dde6"/><text x="625" y="544" font-size="20" font-weight="700" fill="#1f2d5a" text-anchor="start">3. La política no se respeta</text><text x="625" y="594" font-size="40" font-weight="700" fill="#1f2d5a" text-anchor="start">54%</text><text x="625" y="624" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">consulta su política</text><text x="625" y="645" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">a menudo o siempre</text><text x="895" y="594" font-size="40" font-weight="700" fill="#1f2d5a" text-anchor="start">47%</text><text x="895" y="624" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">cree que salirse de ella</text><text x="895" y="645" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">le ahorra dinero</text><rect x="50" y="700" width="1100" height="1" fill="#d9dde6"/><text x="50" y="728" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Fuente: GBTA (2025, 2026); Blacklane (2025)</text><text x="1150" y="728" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="end">Exhibit 1</text></svg>