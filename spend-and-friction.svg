<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Business travel spending is growing faster than trips, and the friction is still manual</title><desc id="d">Global business travel spending per GBTA and top pain points (GBTA 2025, Blacklane 2025).</desc><rect width="1200" height="750" fill="#fff"/><text x="50" y="62" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">Business travel spending is growing faster than trips,</text><text x="50" y="100" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">and the friction is still manual</text><rect x="50" y="124" width="1100" height="1.5" fill="#1f2d5a"/><text x="50" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">MARKET SIZE</text><text x="50" y="232" font-size="50" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.59 trillion</text><text x="50" y="262" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">global business travel spending, 2025</text><text x="50" y="322" font-size="36" font-weight="700" fill="#138a8a" text-anchor="start">+8.4%</text><text x="50" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">spending growth in 2025</text><text x="335" y="322" font-size="36" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71 trillion</text><text x="335" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026 forecast</text><text x="50" y="400" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Spending (US$ trillion)</text><text x="50" y="436" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="416" width="307" height="26" fill="#9aa3b8"/><text x="426.8421052631579" y="436" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.59</text><text x="50" y="472" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026F</text><rect x="110" y="452" width="330" height="26" fill="#138a8a"/><text x="450.0" y="472" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71</text><text x="50" y="510" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Trips (billion)</text><text x="50" y="546" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="526" width="326" height="26" fill="#9aa3b8"/><text x="446.4130434782609" y="546" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.82</text><text x="50" y="582" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026F</text><rect x="110" y="562" width="330" height="26" fill="#138a8a"/><text x="450.0" y="582" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.84</text><text x="50" y="632" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Spending grows faster than the number of trips,</text><text x="50" y="654" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">mainly because transport and lodging cost more.</text><rect x="590" y="150" width="1" height="530" fill="#d9dde6"/><text x="625" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">THREE MESSAGES</text><text x="625" y="212" font-size="20" font-weight="700" fill="#1f2d5a" text-anchor="start">1. Spend per trip is rising</text><text x="625" y="262" font-size="40" font-weight="700" fill="#138a8a" text-anchor="start">$1.59T → $1.71T</text><text x="625" y="292" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">global spend 2025 → 2026 forecast; spending</text><text x="625" y="313" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">is growing faster than trips</text><rect x="625" y="342" width="525" height="1" fill="#d9dde6"/><text x="625" y="378" font-size="20" font-weight="700" fill="#1f2d5a" text-anchor="start">2. Expenses are still a pain</text><text x="625" y="428" font-size="40" font-weight="700" fill="#138a8a" text-anchor="start">Half</text><text x="625" y="458" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">of travel managers say expense reports</text><text x="625" y="479" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">create friction (GBTA, 2025)</text><rect x="625" y="508" width="525" height="1" fill="#d9dde6"/><text x="625" y="544" font-size="20" font-weight="700" fill="#1f2d5a" text-anchor="start">3. Policy is not followed</text><text x="625" y="594" font-size="40" font-weight="700" fill="#1f2d5a" text-anchor="start">54%</text><text x="625" y="624" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">check their policy</text><text x="625" y="645" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">often or always</text><text x="895" y="594" font-size="40" font-weight="700" fill="#1f2d5a" text-anchor="start">47%</text><text x="895" y="624" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">believe going outside it</text><text x="895" y="645" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">saves the company money</text><rect x="50" y="700" width="1100" height="1" fill="#d9dde6"/><text x="50" y="728" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Source: GBTA (2025, 2026); Blacklane (2025)</text><text x="1150" y="728" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="end">Exhibit 1</text></svg>