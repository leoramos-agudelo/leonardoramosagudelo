<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Business travel spending is growing faster than trips, and the friction is still manual</title><desc id="d">Global business travel spending per GBTA and top pain points (GBTA 2025, Blacklane 2025).</desc><rect width="1200" height="750" fill="#fff"/><text x="50" y="62" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">Business travel spending is growing faster than trips,</text><text x="50" y="100" font-size="30" font-weight="700" fill="#1f2d5a" text-anchor="start">and the friction is still manual</text><rect x="50" y="124" width="1100" height="1.5" fill="#1f2d5a"/><text x="50" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">MARKET SIZE</text><text x="50" y="232" font-size="50" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.59 trillion</text><text x="50" y="262" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">global business travel spending, 2025</text><text x="50" y="322" font-size="36" font-weight="700" fill="#138a8a" text-anchor="start">+8.4%</text><text x="50" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">spending growth in 2025</text><text x="335" y="322" font-size="36" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71 trillion</text><text x="335" y="348" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026 forecast</text><text x="50" y="400" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Spending (US$ trillion)</text><text x="50" y="436" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="416" width="307" height="26" fill="#9aa3b8"/><text x="426.8421052631579" y="436" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.59</text><text x="50" y="472" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026F</text><rect x="110" y="452" width="330" height="26" fill="#138a8a"/><text x="450.0" y="472" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">$1.71</text><text x="50" y="510" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Trips (billion)</text><text x="50" y="546" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2025</text><rect x="110" y="526" width="326" height="26" fill="#9aa3b8"/><text x="446.4130434782609" y="546" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.82</text><text x="50" y="582" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">2026F</text><rect x="110" y="562" width="330" height="26" fill="#138a8a"/><text x="450.0" y="582" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">1.84</text><text x="50" y="632" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Spending grows faster than the number of trips,</text><text x="50" y="654" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">mainly because transport and lodging cost more.</text><rect x="590" y="150" width="1" height="530" fill="#d9dde6"/><text x="625" y="168" font-size="17" font-weight="700" fill="#138a8a" text-anchor="start">PAIN POINTS</text><text x="625" y="218" font-size="44" font-weight="700" fill="#138a8a" text-anchor="start">63%</text><text x="625" y="248" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">of travel managers named</text><text x="625" y="269" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">manual, time-consuming</text><text x="625" y="290" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">expense submission the top</text><text x="625" y="311" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">pain point</text><text x="895" y="218" font-size="44" font-weight="700" fill="#138a8a" text-anchor="start">55%</text><text x="895" y="248" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">pointed to automated receipt</text><text x="895" y="269" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">capture and matching as a</text><text x="895" y="290" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">key improvement</text><text x="625" y="376" font-size="22" font-weight="700" fill="#1f2d5a" text-anchor="start">Only</text><text x="685" y="376" font-size="44" font-weight="700" fill="#1f2d5a" text-anchor="start">54%</text><text x="625" y="406" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">of business travelers</text><text x="625" y="427" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">consult their travel policy</text><text x="625" y="448" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">often or always</text><text x="895" y="376" font-size="44" font-weight="700" fill="#1f2d5a" text-anchor="start">47%</text><text x="895" y="406" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">believe going outside policy</text><text x="895" y="427" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">saves the company money</text><rect x="625" y="472" width="525" height="1" fill="#d9dde6"/><text x="625" y="500" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Traveler</text><circle cx="790" cy="494" r="3" fill="#138a8a"/><text x="802" y="500" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Hard-to-use booking tools push people</text><text x="802" y="521" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">outside policy</text><text x="625" y="552" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Finance</text><circle cx="790" cy="546" r="3" fill="#138a8a"/><text x="802" y="552" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Manual processes and receipt chasing</text><circle cx="790" cy="571" r="3" fill="#138a8a"/><text x="802" y="577" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Limited visibility across systems</text><text x="625" y="608" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="start">Travel managers</text><circle cx="790" cy="602" r="3" fill="#138a8a"/><text x="802" y="608" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Hours on disruptions and compliance</text><circle cx="790" cy="627" r="3" fill="#138a8a"/><text x="802" y="633" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Stricter controls, more friction</text><rect x="50" y="700" width="1100" height="1" fill="#d9dde6"/><text x="50" y="728" font-size="17" font-weight="400" fill="#5b6378" text-anchor="start">Source: GBTA (2025, 2026); Blacklane (2025)</text><text x="1150" y="728" font-size="17" font-weight="700" fill="#1f2d5a" text-anchor="end">Exhibit 1</text></svg>